<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trackcare Relay</title><style>body{margin:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#111827}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-top:16px}.status{font-size:12px;padding:6px 10px;border-radius:999px;background:#dcfce7;color:#166534}textarea{width:100%;min-height:320px;border:1px solid #d1d5db;border-radius:10px;padding:12px;font:14px/1.55 Consolas,monospace;box-sizing:border-box}button{border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer;background:#111827;color:#fff;margin-right:6px}.secondary{background:#e5e7eb;color:#111827}.upload{border:1.5px dashed #cbd5e1;border-radius:12px;padding:20px;text-align:center;background:#f8fafc}.file{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid #e5e7eb;border-radius:9px;margin-top:8px}.gate{position:fixed;inset:0;background:rgba(17,24,39,.55);display:flex;align-items:center;justify-content:center}.gatebox{background:#fff;padding:18px;border-radius:14px;width:min(400px,90%)}.gatebox input{width:100%;box-sizing:border-box;padding:11px;margin:10px 0;border:1px solid #d1d5db;border-radius:9px}.hidden{display:none}</style></head><body><div class="wrap"><div class="top"><h2>Trackcare Relay</h2><div id="status" class="status">Live</div></div><div class="card"><b>Latest Output</b><textarea id="note"></textarea><div style="margin-top:10px"><button id="copy">Copy</button><button id="save" class="secondary">Save changes</button><span id="updated" style="font-size:12px;color:#6b7280"></span></div></div><div class="card"><b>Files</b><div class="upload"><input id="fileInput" type="file" accept="application/pdf,image/*" multiple hidden><button id="choose" class="secondary">Upload PDF / Image</button><div style="font-size:12px;color:#6b7280;margin-top:8px">Max 12 MB per file.</div><div id="progress" style="font-size:12px;color:#6b7280;margin-top:6px"></div></div><div id="files"></div></div></div><div id="gate" class="gate"><div class="gatebox"><b>Access code</b><input id="code" type="password" placeholder="Access code"><button id="unlock" style="width:100%">Open Relay</button><div id="gateError" style="font-size:12px;color:#991b1b;margin-top:8px"></div></div></div><script>const API='https://gvuuiazenabtsbmozrbk.supabase.co/functions/v1/relay-api';let key=localStorage.getItem('trackcare_relay_key')||'',dirty=false,last='';const note=document.getElementById('note'),updated=document.getElementById('updated'),files=document.getElementById('files'),gate=document.getElementById('gate'),code=document.getElementById('code');async function api(action,opt={}){const h=new Headers(opt.headers||{});h.set('x-relay-key',key);const r=await fetch(API+'?action='+action+(opt.extra||''),{...opt,headers:h,cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}function fmt(s){try{return new Date(s).toLocaleString()}catch{return''}}function render(fs){files.innerHTML='';if(!fs.length){files.textContent='No files.';return}fs.forEach(f=>{const e=document.createElement('div');e.className='file';const n=document.createElement('span');n.textContent=f.file_name;const a=document.createElement('span');const o=document.createElement('button');o.className='secondary';o.textContent='Open';o.onclick=async()=>{const d=await api('file_url',{extra:'&id='+encodeURIComponent(f.id)});window.open(d.url,'_blank')};const x=document.createElement('button');x.textContent='Delete';x.onclick=async()=>{await api('delete_file',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:f.id})});refresh()};a.append(o,x);e.append(n,a);files.append(e)})}async function refresh(){if(!key)return;try{const d=await api('state');if(!dirty&&document.activeElement!==note&&d.content!==last)note.value=d.content||'';last=d.content||'';updated.textContent=d.updated_at?' Updated '+fmt(d.updated_at):'';render(d.files||[])}catch{}}note.addEventListener('input',()=>dirty=true);document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(note.value);document.getElementById('save').onclick=async()=>{const d=await api('note',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content:note.value})});dirty=false;last=note.value;updated.textContent=' Updated '+fmt(d.updated_at)};const input=document.getElementById('fileInput'),progress=document.getElementById('progress');document.getElementById('choose').onclick=()=>input.click();input.onchange=async()=>{for(const f of input.files){if(f.size>12*1024*1024){progress.textContent='File too large';continue}const fd=new FormData();fd.append('file',f,f.name);progress.textContent='Uploading '+f.name+'...';try{await api('upload',{method:'POST',body:fd});progress.textContent='Uploaded '+f.name}catch(e){progress.textContent=e.message}}input.value='';refresh()};document.getElementById('unlock').onclick=async()=>{key=code.value.trim();try{await api('state');localStorage.setItem('trackcare_relay_key',key);gate.classList.add('hidden');refresh();setInterval(refresh,2000)}catch{key='';document.getElementById('gateError').textContent='Wrong code or connection error.'}};if(key){code.value=key;document.getElementById('unlock').click()}</script></body></html>
