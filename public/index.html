<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trackcare Relay</title><style>:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:0 auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:22px;font-weight:800}.status{font-size:12px;padding:6px 10px;border-radius:999px;background:#e5e7eb}.status.live{background:#dcfce7;color:#166534}.status.err{background:#fee2e2;color:#991b1b}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.label{font-size:13px;font-weight:750;margin-bottom:9px;color:#374151}textarea{width:100%;min-height:430px;resize:vertical;border:1px solid #d1d5db;border-radius:10px;padding:14px;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;outline:none}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;background:#111827;color:#fff}.muted{font-size:12px;color:#6b7280}.gate{position:fixed;inset:0;background:rgba(17,24,39,.58);display:flex;align-items:center;justify-content:center;padding:20px}.gatebox{width:min(420px,100%);background:#fff;border-radius:14px;padding:18px}.gatebox input{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:11px;font-size:15px;margin:10px 0}.hidden{display:none!important}@media(max-width:640px){.wrap{padding:16px 12px 40px}textarea{min-height:360px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">Trackcare Relay</div><div id="status" class="status">Locked</div></div><div class="card"><div class="label">Latest Output</div><textarea id="note" spellcheck="false" placeholder="Latest text will appear here..." readonly></textarea><div class="row"><button id="copy">Copy</button><span id="updated" class="muted"></span></div></div></div><div id="gate" class="gate"><div class="gatebox"><div style="font-weight:800;font-size:17px">Access code</div><div class="muted" style="margin-top:5px">Enter the Trackcare Relay code once on this browser.</div><input id="code" type="password" autocomplete="current-password" placeholder="Access code"><button id="unlock" style="width:100%">Open Relay</button><div id="gateError" class="muted" style="color:#991b1b;margin-top:8px"></div></div></div><script>const note=document.getElementById('note'),statusEl=document.getElementById('status'),updatedEl=document.getElementById('updated'),gate=document.getElementById('gate'),codeInput=document.getElementById('code'),gateError=document.getElementById('gateError');let password=localStorage.getItem('trackcare_relay_key')||'',lastVersion='';function b64urlBytes(str){const s=str.replace(/-/g,'+').replace(/_/g,'/');const pad='='.repeat((4-s.length%4)%4);const bin=atob(s+pad);return Uint8Array.from(bin,c=>c.charCodeAt(0))}async function decrypt(p){const baseKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64urlBytes(p.s),iterations:200000,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64urlBytes(p.i)},key,b64urlBytes(p.d));return new TextDecoder().decode(plain)}async function refresh(){try{const r=await fetch('/latest?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('offline');const p=await r.json();statusEl.className='status live';statusEl.textContent='Live';if(!p.v){note.value='';updatedEl.textContent='No output yet';return}if(p.v!==lastVersion){note.value=await decrypt(p);lastVersion=p.v}updatedEl.textContent=p.updatedAt?'Updated '+new Date(p.updatedAt).toLocaleString():''}catch(e){statusEl.className='status err';statusEl.textContent='Error';if(String(e).includes('OperationError')){gateError.textContent='Wrong access code.';gate.classList.remove('hidden');localStorage.removeItem('trackcare_relay_key')}}}async function unlock(){password=codeInput.value.trim();if(!password)return;gateError.textContent='';try{const r=await fetch('/latest?t='+Date.now(),{cache:'no-store'});const p=await r.json();if(p.v)await decrypt(p);localStorage.setItem('trackcare_relay_key',password);gate.classList.add('hidden');await refresh()}catch(e){password='';gateError.textContent='Wrong access code or connection error.'}}document.getElementById('unlock').onclick=unlock;codeInput.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(note.value);const b=document.getElementById('copy'),old=b.textContent;b.textContent='Copied';setTimeout(()=>b.textContent=old,900)};if(password){codeInput.value=password;unlock()}setInterval(()=>{if(password)refresh()},2000);</script></body></html>
