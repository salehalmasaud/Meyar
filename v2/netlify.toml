[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
[dev]
  framework = "#static"
  publish = "dist"
  port = 8888
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' blob: https://gvuuiazenabtsbmozrbk.supabase.co; connect-src 'self' https://gvuuiazenabtsbmozrbk.supabase.co wss://gvuuiazenabtsbmozrbk.supabase.co; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests"
    X-Robots-Tag = "noindex, nofollow, noarchive"
